name: Validate site before deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML syntax (basic)
        run: |
          pip install html5lib 2>/dev/null || true
          python -c "
import sys, html.parser
class Check(html.parser.HTMLParser):
    def error(self, msg): print(msg); sys.exit(1)
try:
    with open('index.html') as f: Check().feed(f.read())
    print('HTML parse OK')
except Exception as e:
    print('HTML error:', e); sys.exit(1)
"
      - name: Check links not broken (basic)
        run: |
          echo "Revisando enlaces internos a #servicios, #nosotros, #confianza, #resenas, #visitanos..."
          grep -oE 'href="#[^"]+"' index.html | sort | uniq -c
          echo "Enlaces internos presentes. Verificar manualmente URLs externas (WhatsApp, Maps, Facebook) si aplica."
